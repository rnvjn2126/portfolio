    <!-- GitHub Pages does not expose custom header configuration; this meta CSP
         protects the HTML where a header-level policy is unavailable.
         The embedded 3D car's GLTFLoader reads image textures from same-origin
         object URLs; connect-src therefore permits blob:, not remote hosts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests" />
