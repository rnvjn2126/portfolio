name: Capture Real Project Screenshots
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/capture-project-screenshots.mjs'
      - '.github/workflows/capture-project-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Capture screenshots of live projects
        run: node scripts/capture-project-screenshots.mjs
      - name: Commit actual screenshots to portfolio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/screenshots/
          if git diff --cached --quiet; then
            echo "No new screenshots to commit."
          else
            git commit -m "Update genuine live project screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy.yml --ref main
          fi
