name: Import verified anonymous ERP screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-erp-demo-images.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      ERP_DEMO_ZIP: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-467c-8211-885d-cde1984175b9/raw?se=2026-11-22T18%3A31%3A16Z&sp=r&sv=2026-06-06&sr=b&scid=0d4411b1-eb2f-5328-a6a0-2ef115d4a6ff&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T04%3A31%3A08Z&ske=2026-11-23T04%3A31%3A08Z&sks=b&skv=2026-06-06&sig=WHNoa52Vimq/TdG3T0Bng2ayOsKHrkWnnoeyY8DCimc%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Import anonymous ERP demo screenshots
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 95 "$ERP_DEMO_ZIP" -o /tmp/erp-demo-captures.zip
          unzip -t /tmp/erp-demo-captures.zip
          mkdir -p public/images/screenshots
          unzip -j -o /tmp/erp-demo-captures.zip 'erp-*.jpg' -d public/images/screenshots
          python3 - <<'PY'
          from pathlib import Path
          root=Path('public/images/screenshots')
          names=['erp-management.jpg','erp-projects.jpg','erp-inventory.jpg','erp-workspace.jpg']
          for name in names:
              item=root/name
              b=item.read_bytes()
              assert b.startswith(b'\\xff\\xd8\\xff'.decode('unicode_escape').encode('latin1')) if False else b[:3] == bytes([255,216,255])
              assert len(b)>20000,(name,len(b))
              print('Verified real ERP demo JPEG:',name,len(b),'bytes')
          PY
      - name: Commit only demo screenshots to portfolio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/screenshots/erp-management.jpg public/images/screenshots/erp-projects.jpg public/images/screenshots/erp-inventory.jpg public/images/screenshots/erp-workspace.jpg
          if git diff --cached --quiet; then
            echo "ERP screenshots already committed."
          else
            git commit -m "Publish genuine anonymous ERP Software Demo captures"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 6 ]; then exit 1; fi
              sleep 3
            done
          fi
          gh workflow run deploy.yml --ref main
