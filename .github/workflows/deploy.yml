
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment_first.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Wait for Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx "github-pages"; then
              echo "GitHub Pages artifact metadata is available."
              exit 0
            fi
            echo "Waiting for GitHub to index the uploaded Pages artifact ($attempt/24)"
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available"
          exit 1

      # GitHub's artifact listing and the Pages deployment service can
      # become consistent at different times. Retry once after propagation.
      - name: Deploy website
        id: deployment_first
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Allow artifact metadata to propagate after a failed deployment lookup
        if: steps.deployment_first.outcome == 'failure'
        run: sleep 25

      - name: Retry deployment if artifact metadata was temporarily unavailable
        id: deployment_retry
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
