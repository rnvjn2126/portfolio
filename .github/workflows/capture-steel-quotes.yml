name: Capture Steel Quotes from Running Django App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-steel-quotes.yml'
      - 'scripts/capture-steel-portfolio-demo.mjs'
      - 'scripts/seed-steel-portfolio-demo.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: steel-quotes-portfolio-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout actual Steel Quotes development branch
        uses: actions/checkout@v4
        with:
          repository: rnvjn2126/testproj
          ref: ai/steel-mvp-overnight
          path: steel-app
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Django app
        run: python -m pip install -r steel-app/requirements.txt

      - name: Django configuration and database migrations
        working-directory: steel-app
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run

      - name: Run Django test suite
        working-directory: steel-app
        run: python manage.py test --noinput

      - name: Seed disposable synthetic project data
        working-directory: steel-app
        run: python ../scripts/seed-steel-portfolio-demo.py

      - name: Start the actual Django application locally on runner
        run: |
          cd steel-app
          nohup python manage.py runserver 127.0.0.1:8765 --noreload > /tmp/steel-portfolio-django.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/accounts/login/ > /dev/null; then
              echo 'Django server started successfully.'
              exit 0
            fi
            sleep 2
          done
          tail -n 160 /tmp/steel-portfolio-django.log
          exit 1

      - name: Install Chromium screenshot tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Photograph authenticated Django application
        run: node scripts/capture-steel-portfolio-demo.mjs

      - name: Upload screenshots for independent workflow review
        uses: actions/upload-artifact@v4
        with:
          name: steel-quotes-real-app-screenshots
          path: |
            public/images/screenshots/steel-quotes-workspace.png
            public/images/screenshots/steel-quotes-enquiry.png
            public/images/screenshots/steel-quotes-quotation.png
          if-no-files-found: error

      - name: Commit genuine Steel Quotes screenshots to portfolio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/screenshots/steel-quotes-workspace.png
          git add public/images/screenshots/steel-quotes-enquiry.png
          git add public/images/screenshots/steel-quotes-quotation.png
          if git diff --cached --quiet; then
            echo "Screenshots already match the current run."
          else
            git commit -m "Capture genuine Steel Quotes Django demo screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy.yml --ref main
          fi
