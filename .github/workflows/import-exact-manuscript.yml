name: Import Exact Research Manuscript to GitHub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-exact-manuscript.yml'
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check existing manuscript source against uploaded PDF SHA-256
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected="66b4eb85eea50ce2519424cf65acb190803fd05953f47b1e22514c36aa27e909"
          matched=false
          for url in "https://ieee-shortened-format.tiiny.site/?mode=suggestions" "https://ieee-shortened-format.tiiny.site/"; do
            echo "Checking an existing manuscript location (not using it as the final site link)"
            if curl -fsSL --retry 2 --max-time 45 "$url" -o /tmp/manuscript-check.pdf; then
              actual="$(sha256sum /tmp/manuscript-check.pdf | cut -d' ' -f1)"
              echo "Downloaded source SHA-256: $actual"
              if [ "$actual" = "$expected" ]; then
                matched=true
                break
              fi
            fi
          done
          if [ "$matched" != true ]; then
            echo "::warning::Existing URL does not serve the exact PDF uploaded in the conversation. No substitution or upload was performed."
            echo "exact_pdf_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p public/papers
          cp /tmp/manuscript-check.pdf public/papers/ai-driven-resume-screening.pdf
          echo "exact_pdf_available=true" >> "$GITHUB_OUTPUT"
      - name: Inspect previous hosting response without replacing the manuscript
        if: steps.verify.outputs.exact_pdf_available == 'false'
        shell: bash
        run: |
          file -bi /tmp/manuscript-check.pdf || true
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          data = Path('/tmp/manuscript-check.pdf').read_bytes()
          print('Response bytes:',len(data),'signature:',repr(data[:64]))
          if data[:4] != b'%PDF':
              class Links(HTMLParser):
                  def handle_starttag(self,tag,attrs):
                      for key,val in attrs:
                          if key in ('href','src','data') and val:
                              print('HTML reference:',key,repr(val[:250]))
              parser=Links();parser.feed(data.decode('utf-8', errors='replace'))
          PY
      - name: Check PDF bytes loaded inside original viewer
        if: steps.verify.outputs.exact_pdf_available == 'false'
        id: browser
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
          node --input-type=module - <<'JS'
          import { chromium } from 'playwright'
          import { createHash } from 'node:crypto'
          import { writeFileSync, mkdirSync } from 'node:fs'
          const expected = '66b4eb85eea50ce2519424cf65acb190803fd05953f47b1e22514c36aa27e909'
          let exact = false
          const inspected = []
          const tasks = []
          const browser = await chromium.launch({headless:true})
          const page = await browser.newPage({viewport:{width:1280,height:900}})
          page.on('response', response => {
            const type = response.headers()['content-type'] || ''
            const url = response.url()
            if (!/pdf|octet-stream/i.test(type) && !/\.pdf(?:$|\?)/i.test(url)) return
            tasks.push((async () => {
              try {
                const bytes = await response.body()
                const signature = bytes.subarray(0,4).toString()
                const sha = createHash('sha256').update(bytes).digest('hex')
                inspected.push({url:url.slice(0,250),size:bytes.length,type,signature,sha})
                if (signature === '%PDF' && sha === expected) {
                  mkdirSync('public/papers',{recursive:true})
                  writeFileSync('public/papers/ai-driven-resume-screening.pdf',bytes)
                  exact = true
                }
              } catch(e) { console.log('Viewer PDF response not readable:',String(e)) }
            })())
          })
          try {
            await page.goto('https://ieee-shortened-format.tiiny.site/?mode=suggestions', {waitUntil:'domcontentloaded',timeout:40000})
            await page.waitForTimeout(18000)
            await Promise.allSettled(tasks)
            console.log('PDF responses observed:',JSON.stringify(inspected).slice(0,7000))
            console.log('Matching the exact user-uploaded PDF:',exact)
          } catch(e) { console.log('Viewer inspection failed:',String(e)) }
          finally {
            await browser.close()
            const { appendFileSync } = await import('node:fs')
            appendFileSync(process.env.GITHUB_OUTPUT, 'exact_pdf_available='+String(exact)+'\n')
          }
          JS
      - name: Use local PDF link in Career AI Pro
        if: steps.verify.outputs.exact_pdf_available == 'true' || steps.browser.outputs.exact_pdf_available == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/data/projects.js")
          source = path.read_text()
          old = "url: 'https://ieee-shortened-format.tiiny.site/?mode=suggestions'"
          new = "url: import.meta.env.BASE_URL + 'papers/ai-driven-resume-screening.pdf'"
          if old not in source and new not in source:
              raise SystemExit("Existing manuscript URL not found; refusing an unsafe edit.")
          path.write_text(source.replace(old, new))
          PY
      - name: Publish exact PDF to the GitHub portfolio repository
        if: steps.verify.outputs.exact_pdf_available == 'true' || steps.browser.outputs.exact_pdf_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/papers/ai-driven-resume-screening.pdf src/data/projects.js
          if ! git diff --cached --quiet; then
            git commit -m "Host exact research manuscript on portfolio for direct reading and download"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy.yml --ref main
          fi
